<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test All Videos - Dektrix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #0a0a0a; color: #ffffff; }
        .video-test { margin: 20px 0; padding: 20px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; }
        .video-player { width: 100%; max-width: 400px; height: 225px; background: #000; border-radius: 4px; }
        .status { margin: 10px 0; padding: 10px; border-radius: 4px; font-family: monospace; }
        .status.success { background: #1a4d1a; border: 1px solid #4CAF50; }
        .status.error { background: #4d1a1a; border: 1px solid #f44336; }
        .status.loading { background: #1a1a4d; border: 1px solid #2196F3; }
        button { background: #0066cc; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        button:hover { background: #0052a3; }
        .summary { margin: 20px 0; padding: 20px; background: #2a2a2a; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div style="max-width: 1200px; margin: 0 auto;">
        <h1>🎬 Video Playback Test Suite</h1>
        <p>Testing all videos in the public/videos folder to ensure they play correctly.</p>
        
        <div class="summary">
            <h3>Test Summary</h3>
            <div>Total Videos: <span id="total-videos">0</span></div>
            <div>Passed: <span id="passed-videos">0</span></div>
            <div>Failed: <span id="failed-videos">0</span></div>
        </div>

        <div id="video-tests"></div>
        
        <div style="text-align: center; margin: 20px;">
            <button onclick="runAllTests()">🚀 Run All Tests</button>
            <button onclick="location.reload()">🔄 Refresh Page</button>
        </div>
    </div>

    <script>
        const videosToTest = [
            { filename: 'Ep1.mp4', title: 'Episode 1' },
            { filename: 'Eps2.mp4', title: 'Episode 2' },
            { filename: 'Vid3.mp4', title: 'Educational Video 3' },
            { filename: 'Vid4.mp4', title: 'Educational Video 4' },
            { filename: 'TestVideo.mp4', title: 'Test Video' }
        ];

        let testResults = [];

        function createVideoTest(video, index) {
            const testDiv = document.createElement('div');
            testDiv.className = 'video-test';
            testDiv.id = `test-${index}`;
            
            testDiv.innerHTML = `
                <h3>${video.title}</h3>
                <div>File: ${video.filename}</div>
                <video id="video-${index}" class="video-player" controls preload="metadata" muted>
                    <source src="/videos/${video.filename}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div id="status-${index}" class="status loading">Loading...</div>
                <button onclick="testVideo(${index})">▶️ Test Playback</button>
            `;
            
            return testDiv;
        }

        function updateStatus(index, status, message) {
            const statusEl = document.getElementById(`status-${index}`);
            statusEl.className = `status ${status}`;
            statusEl.textContent = message;
            
            const existing = testResults.find(r => r.index === index);
            if (existing) {
                existing.status = status;
                existing.message = message;
            } else {
                testResults.push({ index, status, message });
            }
            
            updateSummary();
        }

        function updateSummary() {
            const total = testResults.length;
            const passed = testResults.filter(r => r.status === 'success').length;
            const failed = testResults.filter(r => r.status === 'error').length;
            
            document.getElementById('total-videos').textContent = total;
            document.getElementById('passed-videos').textContent = passed;
            document.getElementById('failed-videos').textContent = failed;
        }

        async function testVideo(index) {
            const video = document.getElementById(`video-${index}`);
            const videoData = videosToTest[index];
            
            updateStatus(index, 'loading', 'Testing playback...');
            
            try {
                // Test 1: Check if video can load metadata
                await new Promise((resolve, reject) => {
                    video.onloadedmetadata = resolve;
                    video.onerror = () => reject(new Error('Failed to load video'));
                    
                    if (video.readyState >= 1) {
                        resolve();
                    }
                });
                
                updateStatus(index, 'loading', 'Metadata loaded. Testing play...');
                
                // Test 2: Try to play the video
                await video.play();
                
                updateStatus(index, 'loading', 'Playing... testing duration...');
                
                // Wait a bit to see if it continues playing
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Check if video is actually playing
                if (video.currentTime > 0) {
                    updateStatus(index, 'success', '✅ Video plays correctly! Duration: ' + 
                        (video.duration ? Math.floor(video.duration) + 's' : 'Unknown'));
                } else {
                    updateStatus(index, 'error', '❌ Video loaded but not playing');
                }
                
                // Pause the video
                video.pause();
                
            } catch (error) {
                updateStatus(index, 'error', `❌ Error: ${error.message}`);
                console.error(`Video ${index} error:`, error);
            }
        }

        async function runAllTests() {
            console.log('🚀 Starting video tests...');
            
            for (let i = 0; i < videosToTest.length; i++) {
                console.log(`Testing video ${i + 1}/${videosToTest.length}: ${videosToTest[i].filename}`);
                
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                try {
                    await testVideo(i);
                    await new Promise(resolve => setTimeout(resolve, 2000));
                } catch (error) {
                    console.error(`Failed to test video ${i}:`, error);
                    updateStatus(i, 'error', `❌ Test failed: ${error.message}`);
                }
            }
            
            console.log('✅ All tests completed!');
        }

        function initializePage() {
            const container = document.getElementById('video-tests');
            
            videosToTest.forEach((video, index) => {
                const testElement = createVideoTest(video, index);
                container.appendChild(testElement);
            });
            
            updateSummary();
            
            setTimeout(() => {
                console.log('🎬 Auto-starting video tests...');
                runAllTests();
            }, 2000);
        }

        document.addEventListener('DOMContentLoaded', initializePage);

        console.log('🎬 Video Test Suite Loaded');
        console.log('Videos to test:', videosToTest);
    </script>
</body>
</html>
